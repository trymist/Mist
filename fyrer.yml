installers:
  - dir: apps/web
    cmd: bun install
services:

  - name: daemon
    dir: apps/daemon
    cmd: go run main.go
    env:
      ENV: dev
    watch: true
    ignore: 
      - "*.db*"
      - "*.db-journal"

  - name: dash
    dir: apps/web
    cmd: bun dev --host
    env:
      VITE_API_URL: http://localhost:8080
