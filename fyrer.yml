installers:
  - dir: dash
    cmd: bun install
services:

  - name: daemon 
    dir: .
    cmd: go run cmd/daemon/main.go
    env:
      ENV: dev
    watch: true
    ignore: 
      - "*.db*"
      - "*.db-journal"

  - name: web
    dir: ./web
    cmd: bun dev 
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080
