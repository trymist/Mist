installers:
  - dir: ./ 
    cmd: go mod tidy


services:
  - name: daemon 
    dir: .
    cmd: go run cmd/daemon/main.go
    env:
      ENV: dev
    watch: true
    include: 
      - "cmd/daemon/**"
      - "internal/**"
      - "views/**"
      - "assets/**"
      - "public/**"

  - name: templ
    dir: .
    cmd: go tool templ generate --watch
    watch: false

  - name: tailwind
    dir: .
    cmd: bunx @tailwindcss/cli -i assets/global.css -o public/output.css --watch
    quiet: true
